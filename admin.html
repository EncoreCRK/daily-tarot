<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    
    <title>Daily Tarot Admin</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="shell">
      <h1>ADMIN PANEL</h1>
      <p class="subtitle">Daily Tarot management</p>
<section id="login" class="panel">
  <h2>Secure sign in</h2>
  <label>Email<input id="email" type="email" autocomplete="email"></label>
  <label>Password<input id="password" type="password" autocomplete="current-password">
  </label>
  <button id="signin">Sign in</button></section>
<section id="dashboard" class="hidden">
  <button id="signout" class="secondary">Sign out</button>
  <section class="panel">
    <h2>Draw statistics</h2>
    <div id="stats"></div>
    <h3>Recent draws</h3>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Browser ID (short)</th>
            <th>Day (UTC)</th>
            <th>Reward</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody id="history"></tbody>
      </table>
    </div>
  </section>
<section class="panel">
  <h2>Add a reward</h2>
  <label>Reward name<input id="rewardName" maxlength="80" placeholder="Golden Fortune"></label>
  <label>Tarot amount<input id="amount" type="number" min="0" value="50"></label>
  <label>Weight (relative probability)<input id="weight" type="number" min="0" max="100000" value="10"></label>
  <label>Reward PNG (optional, up to 5 MB)<input id="image" type="file" accept="image/png"></label>
  <button id="add">Add reward</button>
  <p class="hint">Probability = weight ÷ total weight of active rewards. Set weight 0 to exclude.</p>
</section>
  <section class="panel">
    <h2>Manage rewards</h2>
    <div id="rewards"></div>
  </section>
</section>
<p id="notice" class="notice" role="status"></p>
      <footer>
        <a href="index.html">← Back to cards</a>
      </footer>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="config.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
