<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#10112c">
    <title>Daily Tarot</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="shell">
      <div class="stars">✦ · ✧ · ✦</div>
      <h1>DAILY TAROT</h1>
      <p class="subtitle">The cards await your destiny</p>
      <section id="game" class="panel">
        <h2>Choose your destiny</h2>
        <p class="hint">One draw per browser per UTC day. No sign-in required.</p>
        <div class="cards">
          <button class="tarot-card" aria-label="Choose card one">
            <span>✦
              <small>I</small>
            </span>
          </button>
          <button class="tarot-card" aria-label="Choose card two">
            <span>✦
              <small>II</small>
            </span>
          </button>
          <button class="tarot-card" aria-label="Choose card three">
            <span>✦
              <small>III</small>
            </span>
          </button>
        </div>
        <div id="result" class="result" aria-live="polite"></div>
      </section>
      <p id="notice" class="notice" role="status">Connecting to the stars…</p>
      <footer>✧ The stars reset at 00:00 UTC ✧ <a href="admin.html">Admin</a></footer>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
